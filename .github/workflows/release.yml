name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Require the tag to match package.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME || "";
            const version = tag.startsWith("v") ? tag.slice(1) : "";
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version) || pkg.version !== version) {
              console.error(`Refusing to publish ${pkg.name}@${pkg.version}; tag is ${tag}`);
              process.exit(1);
            }
          '

      - name: Validate, pack, and smoke-test
        run: |
          npm ci
          npm run ci

      - name: Publish to npm with provenance
        run: npm publish --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; const pkg = JSON.parse(readFileSync("package.json", "utf8")); process.stdout.write(pkg.name + "@" + pkg.version)')"
          notes="$(mktemp)"
          printf '%s\n' \
            "Publishes ${name} to npm." \
            "" \
            "The git tag matches package.json. This workflow validated the package, packed it, and smoke-tested the tarball with npx before publishing it with npm provenance." \
            > "$notes"
          shopt -s nullglob
          tarballs=( ./*.tgz )
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            "${tarballs[@]}"
