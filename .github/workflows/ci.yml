name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24
        os:
          - ubuntu-latest
        include:
          - node: 22
            os: macos-latest
          - node: 22
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install, validate, pack, and smoke-test
        run: |
          npm ci
          npm run ci

      - name: Upload package and coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.node }}-${{ matrix.os }}
          path: |
            *.tgz
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        run: |
          result="${{ needs.validate.result }}"
          echo "validate=${result}"
          test "$result" = "success"
